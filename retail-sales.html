<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retail Sales Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ac:#2563eb;--gn:#16a34a;--rd:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2a2f38;--ac:#60a5fa;--gn:#4ade80;--rd:#f87171}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2a2f38;--ac:#60a5fa;--gn:#4ade80;--rd:#f87171}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:1000px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.f{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.c .l{font-size:12px;color:var(--mu)}.c .v{font-size:22px;font-weight:600;margin-top:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}
h2{font-size:14px;margin:0 0 10px}
.b{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.b .n{width:110px;flex:none}.b .t{flex:1;background:var(--bd);border-radius:6px;height:14px;overflow:hidden}
.b .t i{display:block;height:100%;background:var(--ac)}.b .a{width:78px;text-align:right;flex:none}
svg{width:100%;height:auto}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.dt{fill:var(--ac)}.tx{fill:var(--mu);font-size:11px}
.o{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
.foot{color:var(--mu);font-size:12px;margin-top:10px}
</style></head><body><div class="w">
<h1>Retail Sales Dashboard</h1>
<div class="sub">FY 2025 · Sample data for demonstration</div>
<div class="f"><select id="rg"></select><select id="ct"></select></div>
<div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Monthly sales trend</h2><svg id="tr" viewBox="0 0 600 210"></svg></div>
<div class="c"><h2>Sales by category</h2><div id="cb"></div><h2 style="margin-top:16px">Sales by region</h2><div id="rb"></div></div></div>
<div class="c"><h2>Top 5 products</h2><div class="o"><table id="tp"></table></div></div>
<div class="foot">Built with Python and JavaScript · Filters update every chart.</div>
</div>
<script>
let s=42;function r(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const P={Technology:[["Laptop",52000,.14],["Monitor",14000,.18],["Keyboard",2500,.25],["Printer",9000,.1]],Furniture:[["Chair",6500,.12],["Desk",15000,.08],["Bookcase",8000,.05],["Lamp",1800,.3]],"Office Supplies":[["Paper",450,.35],["Binder",300,.3],["Pen Set",250,.4],["Stapler",600,.28]]};
const RG=["West","East","Central","South"],MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],CT=Object.keys(P);
const D=[];for(let i=0;i<1800;i++){const c=CT[r()*3|0],p=P[c][r()*4|0];let m=r()*12|0;if(r()<.25)m=9+(r()*3|0);const q=1+(r()*4|0),sa=Math.round(p[1]*q*(.9+r()*.2));D.push({m,g:RG[r()*4|0],c,p:p[0],s:sa,f:Math.round(sa*(p[2]+(r()-.5)*.1))})}
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const fill=(id,a,l)=>{document.getElementById(id).innerHTML=`<option value="">${l}</option>`+a.map(x=>`<option>${x}</option>`).join("")};
fill("rg",RG,"All regions");fill("ct",CT,"All categories");
const sum=(a,k)=>a.reduce((x,y)=>x+y[k],0);
function bars(id,o){const mx=Math.max(...o.map(x=>x[1]),1);document.getElementById(id).innerHTML=o.map(x=>`<div class="b"><span class="n">${x[0]}</span><span class="t"><i style="width:${x[1]/mx*100}%"></i></span><span class="a">${inr(x[1])}</span></div>`).join("")}
function render(){const g=rg.value,c=ct.value,d=D.filter(x=>(!g||x.g===g)&&(!c||x.c===c));
const S=sum(d,"s"),F=sum(d,"f");
k.innerHTML=[["Total sales",inr(S)],["Total profit",inr(F)],["Orders",d.length.toLocaleString("en-IN")],["Profit margin",(S?F/S*100:0).toFixed(1)+"%"]].map(x=>`<div class="c"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("");
const mm=MO.map((_,i)=>sum(d.filter(x=>x.m===i),"s")),mx=Math.max(...mm,1),pt=mm.map((v,i)=>[30+i*49,180-v/mx*150]);
tr.innerHTML=`<polyline class="ln" points="${pt.map(p=>p.join(",")).join(" ")}"/>`+pt.map((p,i)=>`<circle class="dt" cx="${p[0]}" cy="${p[1]}" r="4"><title>${MO[i]}: ${inr(mm[i])}</title></circle><text class="tx" x="${p[0]}" y="203" text-anchor="middle">${MO[i]}</text>`).join("");
bars("cb",CT.map(x=>[x,sum(d.filter(y=>y.c===x),"s")]));bars("rb",RG.map(x=>[x,sum(d.filter(y=>y.g===x),"s")]));
const pr={};d.forEach(x=>{(pr[x.p]=pr[x.p]||{s:0,f:0});pr[x.p].s+=x.s;pr[x.p].f+=x.f});
tp.innerHTML="<tr><th>Product</th><th>Sales</th><th>Profit</th><th>Margin</th></tr>"+Object.entries(pr).sort((a,b)=>b[1].s-a[1].s).slice(0,5).map(([n,v])=>`<tr><td>${n}</td><td>${inr(v.s)}</td><td>${inr(v.f)}</td><td>${(v.f/v.s*100).toFixed(1)}%</td></tr>`).join("");}
rg.onchange=ct.onchange=render;render();
</script></body></html>
