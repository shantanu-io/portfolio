<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coaching Class Fees Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e4e7ec;--ac:#2563eb;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2a2f38;--ac:#60a5fa;--on:#0f1115}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mu:#9aa3b2;--bd:#2a2f38;--ac:#60a5fa;--on:#0f1115}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:1000px;margin:0 auto}h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tb button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:20px;padding:8px 14px;font-size:14px;cursor:pointer}
.tb button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.f{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.c .l{font-size:12px;color:var(--mu)}.c .v{font-size:22px;font-weight:600;margin-top:4px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin-bottom:10px}
h2{font-size:14px;margin:0 0 10px}
.b{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.b .n{width:105px;flex:none}.b .t{flex:1;background:var(--bd);border-radius:6px;height:14px;overflow:hidden}
.b .t i{display:block;height:100%;background:var(--ac)}.b .a{width:78px;text-align:right;flex:none}
svg{width:100%;height:auto}.ln{fill:none;stroke:var(--ac);stroke-width:2.5}.dt{fill:var(--ac)}.tx{fill:var(--mu);font-size:11px}
.o{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:right;padding:8px;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:500}
.foot{color:var(--mu);font-size:12px;margin-top:10px}
</style></head><body><div class="w">
<h1 id="h1"></h1><div class="sub">FY 2025 · Sample data for demonstration</div>
<div class="tb" id="tb" style="display:none"></div>
<div class="f"><select id="ga"></select><select id="gb"></select></div>
<div class="k" id="k"></div>
<div class="g"><div class="c"><h2>Monthly trend</h2><svg id="tr" viewBox="0 0 600 210"></svg></div>
<div class="c"><h2 id="ha"></h2><div id="ba"></div><h2 id="hb" style="margin-top:16px"></h2><div id="bb"></div></div></div>
<div class="c"><h2>Top 5 by revenue</h2><div class="o"><table id="tp"></table></div></div>
<div class="foot">Built with Python and JavaScript · Filters update every chart.</div>
</div>
<script>
let s=1;function r(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const C=[
{n:"Clinic",t:"Clinic Appointments Dashboard",L:["Revenue","Appointments","Avg fee","No-show rate"],an:"By department",bn:"By visit type",A:["General","Dental","Pediatrics","Skin"],B:["New","Follow-up"],bf:.6,pk:[6,7,8],fp:.12,N:1500,
I:{General:[["Consultation",400],["Fever panel",900],["BP check",200]],Dental:[["Cleaning",1200],["Filling",2500],["Root canal",7000]],Pediatrics:[["Checkup",500],["Vaccination",1100],["Growth review",600]],Skin:[["Consultation",600],["Acne therapy",2500],["Peel",3500]]}},
{n:"Coaching",t:"Coaching Class Fees Dashboard",L:["Fees collected","Enrolments","Avg fee","Pending rate"],an:"By batch",bn:"By mode",A:["Class 10","Class 11 Sci","Class 12 Sci","JEE / NEET"],B:["Offline","Online"],bf:.8,pk:[5,6,7],fp:.18,N:1200,
I:{"Class 10":[["Maths + Science",14000],["Full course",22000]],"Class 11 Sci":[["PCM",30000],["PCB",32000]],"Class 12 Sci":[["PCM",34000],["PCB",36000]],"JEE / NEET":[["Crash course",25000],["2-year program",90000]]}},
{n:"Kirana",t:"Kirana Store Sales Dashboard",L:["Sales","Orders","Avg bill","Return rate"],an:"By category",bn:"By channel",A:["Grocery","Dairy","Snacks","Personal care"],B:["Counter","Home delivery"],bf:1.15,pk:[9,10,11],fp:.04,N:1800,
I:{Grocery:[["Rice 5kg",380],["Atta 5kg",260],["Cooking oil 1L",170]],Dairy:[["Milk",60],["Paneer",90],["Ghee 500ml",340]],Snacks:[["Chips",30],["Biscuits",45],["Namkeen",110]],"Personal care":[["Soap pack",140],["Shampoo",210],["Toothpaste",95]]}}];
C.splice(0,C.length,C[1]);
C.forEach(c=>{s=c.n.length*13+5;c.d=[];for(let i=0;i<c.N;i++){const a=c.A[r()*c.A.length|0],b=c.B[r()*2|0],it=c.I[a][r()*c.I[a].length|0];let m=r()*12|0;if(r()<.2)m=c.pk[r()*3|0];c.d.push({m,a,b,i:it[0],v:Math.round(it[1]*(.85+r()*.3)*(b===c.B[1]?c.bf:1)),x:r()<c.fp?1:0})}});
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),sum=a=>a.reduce((x,y)=>x+y.v,0);
let cur=0;
function opts(el,a,l){el.innerHTML=`<option value="">${l}</option>`+a.map(x=>`<option>${x}</option>`).join("")}
function bars(id,o){const mx=Math.max(...o.map(x=>x[1]),1);document.getElementById(id).innerHTML=o.map(x=>`<div class="b"><span class="n">${x[0]}</span><span class="t"><i style="width:${x[1]/mx*100}%"></i></span><span class="a">${inr(x[1])}</span></div>`).join("")}
function pick(i){cur=i;const c=C[i];h1.textContent=c.t;opts(ga,c.A,"All "+c.an.slice(3)+"s");opts(gb,c.B,"All "+c.bn.slice(3)+"s");[...tb.children].forEach((b,j)=>b.className=j===i?"on":"");render()}
function render(){const c=C[cur],d=c.d.filter(x=>(!ga.value||x.a===ga.value)&&(!gb.value||x.b===gb.value)),ok=d.filter(x=>!x.x),S=sum(ok),n=d.length;
k.innerHTML=[[c.L[0],inr(S)],[c.L[1],n.toLocaleString("en-IN")],[c.L[2],inr(ok.length?S/ok.length:0)],[c.L[3],(n?(n-ok.length)/n*100:0).toFixed(1)+"%"]].map(x=>`<div class="c"><div class="l">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("");
const mm=MO.map((_,i)=>sum(ok.filter(x=>x.m===i))),mx=Math.max(...mm,1),pt=mm.map((v,i)=>[30+i*49,180-v/mx*150]);
tr.innerHTML=`<polyline class="ln" points="${pt.map(p=>p.join(",")).join(" ")}"/>`+pt.map((p,i)=>`<circle class="dt" cx="${p[0]}" cy="${p[1]}" r="4"><title>${MO[i]}: ${inr(mm[i])}</title></circle><text class="tx" x="${p[0]}" y="203" text-anchor="middle">${MO[i]}</text>`).join("");
ha.textContent=c.an;hb.textContent=c.bn;
bars("ba",c.A.map(x=>[x,sum(ok.filter(y=>y.a===x))]));bars("bb",c.B.map(x=>[x,sum(ok.filter(y=>y.b===x))]));
const pr={};ok.forEach(x=>{(pr[x.i]=pr[x.i]||{n:0,v:0});pr[x.i].n++;pr[x.i].v+=x.v});
tp.innerHTML="<tr><th>Item</th><th>Count</th><th>Revenue</th><th>Avg</th></tr>"+Object.entries(pr).sort((a,b)=>b[1].v-a[1].v).slice(0,5).map(([m,v])=>`<tr><td>${m}</td><td>${v.n}</td><td>${inr(v.v)}</td><td>${inr(v.v/v.n)}</td></tr>`).join("")}
tb.innerHTML=C.map((c,i)=>`<button onclick="pick(${i})">${c.n}</button>`).join("");
ga.onchange=gb.onchange=render;pick(0);
</script></body></html>
